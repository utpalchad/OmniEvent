name: Import complete PactAI source

on:
  push:
    branches: [main]
    paths:
      - 'PactAI-Source-READY'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Restore complete application source
        shell: bash
        run: |
          set -euo pipefail
          cat PactAI-Source.b64.part* | base64 --decode > "$RUNNER_TEMP/PactAI-Source.zip"
          mkdir -p "$RUNNER_TEMP/pactai"
          unzip -q "$RUNNER_TEMP/PactAI-Source.zip" -d "$RUNNER_TEMP/pactai"
          cp -a "$RUNNER_TEMP/pactai/pactai/." .
          rm -f PactAI-Source.b64.part* PactAI-Source-READY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and verify production build
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit application source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish complete PactAI application source"
          git push origin main
